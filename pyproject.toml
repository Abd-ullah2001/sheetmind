[project]
name = "sheetmind"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "gunicorn==22.0.0",
    "pydantic>=2.7.4",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.27.0",
    "supabase==2.4.6",
    "boto3==1.34.96",
    "upstash-redis==1.1.0",
    "openpyxl==3.1.2",
    "gspread==6.1.2",
    "google-auth==2.29.0",
    "google-auth-oauthlib==1.2.0",
    "msal==1.28.0",
    "langchain>=0.2.5",
    "langchain-openai==0.1.7",
    "openai==1.25.1",
    "celery==5.4.0",
    "redis==5.0.4",
    "structlog==24.1.0",
    "sentry-sdk[fastapi]==2.1.1",
    "slowapi==0.1.9",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "email-validator==2.1.1",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "langgraph>=0.1.5",
    "langsmith>=0.1.77",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "bandit>=1.7.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["backend"]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001",  # handled by formatter
    "D203", "D212", "D213", "D214", "D215", "D406", "D407", "D408", "D409", "D410", "D411", "D412", "D413",  # conflicts
    "ANN101", "ANN102",  # Python 3.12+ self/cls type
    "ANN401",  # too restrictive
    "S101",  # allow assert in tests (bandit)
]
unsafe-fixes = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.bandit]
exclude_dirs = ["backend/tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["default"]
markers = ["asyncio: mark test as asyncio"]
